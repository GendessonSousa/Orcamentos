<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alterar Orçamento</title>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",sans-serif; }

        body {
            background: linear-gradient(135deg, #101820, #1e2a38);
            color:#f0f0f0;
            min-height:100vh;
            padding:40px;
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        h1 {
            margin-bottom:30px;
            font-size:2rem;
            color:#00bcd4;
            text-transform:uppercase;
            letter-spacing:2px;
        }

        .card {
            width:100%;
            max-width:1000px;
            background:#1f2d3b;
            padding:25px;
            border-radius:12px;
            margin-bottom:25px;
            box-shadow:0 0 20px rgba(0,0,0,0.25);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #00bcd4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .form-group {
            justify-content: space-between;
        }

        .card label {
            min-width: 130px;
            font-weight: 600;
            color: #00bcd4;
        }

        .form-group {
            margin-bottom:15px;
            display:flex;
            gap:10px;
            align-items:center;
        }

        select,input {
            flex:1;
            padding:8px;
            border-radius:6px;
            border:none;
        }

        button {
            padding:8px 15px;
            border-radius:6px;
            border:none;
            cursor:pointer;
            font-weight:bold;
        }

        .btn-add { background:#00bcd4; color:#fff; }

        .buttons-container {
            display:flex;
            justify-content:flex-end;
            gap:15px;
            margin-top:25px;
        }

        .btn {
            padding:12px 20px;
            border-radius:8px;
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:1px;
            text-decoration:none;
            cursor:pointer;
            border:none;
        }

        .btn-save { background:#4caf50; color:#fff; }
        .btn-save:hover { background:#43a047; }

        .btn-cancel { background:#f44336; color:#fff; }

        table { width:100%; border-collapse:collapse; margin-top:15px; }
        th,td { padding:10px; text-align:center; }
        thead { background:#00bcd4; }

        .total-box {
            margin-top:20px;
            font-size:1.2rem;
            text-align:right;
            color:#ffca28;
        }
    </style>
</head>

<body>

<h1>Alterar Orçamento</h1>

<form th:action="@{/orcamentos/ui/alterar/{id}(id=*{id})}"
      th:object="${orcamento}"
      method="post">

    <input type="hidden" th:field="*{id}" />

    <!-- CLIENTE -->
    <div class="card">
        <h3>Cliente</h3>
        <div class="form-group">
            <select th:field="*{clienteId}" required>
                <option value="">Selecione</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nome}">
                </option>
            </select>
        </div>
    </div>

    <!-- SERVIÇOS -->
    <div class="card">
        <h3>Serviços</h3>

        <div class="form-group">
            <select id="servicoSelect">
                <option value="">Selecione Serviço</option>
                <option th:each="servico : ${servicos}"
                        th:value="${servico.id}"
                        th:text="${servico.nome}">
                </option>
            </select>

            <input type="number" id="quantidade" placeholder="Qtd" min="1">
            <input type="number" id="precoUnit" placeholder="Preço Unit" step="0.01">

            <button type="button" class="btn-add" onclick="adicionarItem()">Adicionar</button>
        </div>

        <table>
            <thead>
            <tr>
                <th>Serviço</th>
                <th>Qtd</th>
                <th>Preço Unit</th>
                <th>Subtotal</th>
                <th>Ação</th>
            </tr>
            </thead>

            <tbody id="tabelaItens">

            <tr th:each="item, stat : *{itens}"
                th:id="'linha-' + ${stat.index}">

                <td th:text="${item.servicoNome}"></td>
                <td th:text="${item.quantidade}"></td>
                <td th:text="${item.precoUnit}"></td>
                <td th:text="${item.quantidade * item.precoUnit}"></td>
                <td>
                    <button type="button"
                            th:onclick="'removerItem(' + ${stat.index} + ',' + (${item.quantidade} * ${item.precoUnit}) + ')'">
                        Remover
                    </button>
                </td>
            </tr>

            </tbody>
        </table>

        <!-- HIDDEN ITENS -->
        <div id="hiddenContainer">

            <div th:each="item, stat : *{itens}"
                 th:id="'hidden-' + ${stat.index}"
                 style="display:none;">

                <input type="hidden"
                       th:name="'itens[' + ${stat.index} + '].servicoId'"
                       th:value="${item.servicoId}" />

                <input type="hidden"
                       th:name="'itens[' + ${stat.index} + '].quantidade'"
                       th:value="${item.quantidade}" />

                <input type="hidden"
                       th:name="'itens[' + ${stat.index} + '].precoUnit'"
                       th:value="${item.precoUnit}" />

            </div>

        </div>

        <div class="total-box">
            Total: R$ <span id="total">0.00</span>
        </div>

    </div>

    <!-- DATAS -->
    <div class="card">
        <h3>Datas</h3>
        <div class="form-group">
            <label>Data Criação:</label>
            <input type="date" th:field="*{dataCriacao}" required> </div>
        <div class="form-group">
            <label>Data Validade:</label> <input type="date" th:field="*{dataValidade}" required>
        </div>
    </div>

    <div class="buttons-container">
        <a th:href="@{/orcamentos/ui/listar}" class="btn btn-cancel">
            Cancelar
        </a>
        <button type="submit" class="btn btn-save">
            Salvar Alterações
        </button>
    </div>

</form>

<script th:inline="javascript">

    let total = 0;
    let index = [[${#lists.size(orcamento.itens)}]];

    window.onload = function() {
        /*<![CDATA[*/
        let itens = [[${orcamento.itens}]];
        if (itens) {
            itens.forEach(i => {
                total += (i.quantidade * i.precoUnit);
            });
        }
        /*]]>*/
        document.getElementById("total").innerText = total.toFixed(2);
    };

    function adicionarItem() {

        const select = document.getElementById("servicoSelect");
        const servicoId = select.value;
        const servicoNome = select.options[select.selectedIndex]?.text;

        const quantidade = parseFloat(document.getElementById("quantidade").value);
        const precoUnit = parseFloat(document.getElementById("precoUnit").value);

        if (!servicoId || !quantidade || quantidade <= 0 || !precoUnit || precoUnit <= 0) {
            alert("Preencha corretamente.");
            return;
        }

        const subtotal = quantidade * precoUnit;
        total += subtotal;
        document.getElementById("total").innerText = total.toFixed(2);

        const tabela = document.getElementById("tabelaItens");
        const hiddenContainer = document.getElementById("hiddenContainer");

        const linha = document.createElement("tr");
        linha.id = `linha-${index}`;
        linha.innerHTML = `
            <td>${servicoNome}</td>
            <td>${quantidade}</td>
            <td>${precoUnit.toFixed(2)}</td>
            <td>${subtotal.toFixed(2)}</td>
            <td><button type="button" onclick="removerItem(${index}, ${subtotal})">Remover</button></td>
        `;
        tabela.appendChild(linha);

        const hidden = document.createElement("div");
        hidden.id = `hidden-${index}`;
        hidden.style.display = "none";
        hidden.innerHTML = `
            <input type="hidden" name="itens[${index}].servicoId" value="${servicoId}">
            <input type="hidden" name="itens[${index}].quantidade" value="${quantidade}">
            <input type="hidden" name="itens[${index}].precoUnit" value="${precoUnit}">
        `;
        hiddenContainer.appendChild(hidden);

        index++;
    }

    function removerItem(i, subtotal) {

        document.getElementById(`linha-${i}`)?.remove();
        document.getElementById(`hidden-${i}`)?.remove();

        total -= subtotal;
        if (total < 0) total = 0;
        document.getElementById("total").innerText = total.toFixed(2);

        reindexarItens();
    }

    function reindexarItens() {

        const linhas = document.querySelectorAll("#tabelaItens tr");
        const hiddens = document.querySelectorAll("#hiddenContainer > div");

        linhas.forEach((linha, novoIndex) => {
            linha.id = `linha-${novoIndex}`;

            const subtotal = parseFloat(linha.children[3].innerText);
            const botao = linha.querySelector("button");

            botao.setAttribute("onclick", `removerItem(${novoIndex}, ${subtotal})`);
        });

        hiddens.forEach((hidden, novoIndex) => {
            hidden.id = `hidden-${novoIndex}`;

            const inputs = hidden.querySelectorAll("input");

            inputs[0].name = `itens[${novoIndex}].servicoId`;
            inputs[1].name = `itens[${novoIndex}].quantidade`;
            inputs[2].name = `itens[${novoIndex}].precoUnit`;
        });

        index = linhas.length;
    }

</script>

</body>
</html>
