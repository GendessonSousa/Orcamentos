<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Clientes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #101820, #1e2a38);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 2rem;
            color: #00bcd4;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
        }

        table {
            width: 100%;
            max-width: 1100px;
            border-collapse: collapse;
            background: #1f2d3b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
        }

        thead {
            background: #00bcd4;
            color: #fff;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.9rem;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }

        tbody tr:hover {
            background: rgba(0, 188, 212, 0.15);
        }

        td a {
            display: inline-block;
            margin: 3px;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            color: #fff;
            transition: 0.3s;
        }

        .btn-detalhes { background: #3a7bd5; }
        .btn-editar   { background: #ffc107; color: #222; }
        .btn-deletar  { background: #e53935; }

        .btn-detalhes:hover { background: #2a5fa2; }
        .btn-editar:hover   { background: #e0a800; }
        .btn-deletar:hover  { background: #b71c1c; }

        .btn-adicionar {
            display: inline-block;
            background-color: #ffca28;
            color: #000;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .btn-adicionar:hover {
            background-color: #ffc107;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead {
                display: none;
            }

            tbody tr {
                margin-bottom: 20px;
                background: #263646;
                border-radius: 12px;
                padding: 15px;
            }

            td {
                display: flex;
                justify-content: space-between;
                padding: 10px 5px;
            }

            td::before {
                content: attr(data-label);
                font-weight: bold;
                color: #00bcd4;
            }
        }
    </style>
</head>

<body>

<h1>Lista de Clientes</h1>

<a class="btn-adicionar" th:href="@{/clientes/ui/adicionar}">
    Adicionar Novo Cliente
</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Telefone</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.id}" data-label="ID"></td>
        <td th:text="${cliente.nome}" data-label="Nome"></td>
        <td th:text="${cliente.email}" data-label="Email"></td>
        <td th:text="${cliente.telefone}" data-label="Telefone"></td>

        <td data-label="Ações">
            <a class="btn-detalhes"
               th:href="@{/clientes/ui/detalhes/{id}(id=${cliente.id})}">
                Ver
            </a>

            <a class="btn-editar"
               th:href="@{/clientes/ui/alterar/{id}(id=${cliente.id})}">
                Alterar
            </a>

            <a class="btn-deletar"
               th:href="@{/clientes/ui/deletar/{id}(id=${cliente.id})}">
                Deletar
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
